; Korean tooltips for the plugin's Details panels.
; Run from the project folder:
;   UnrealEditor-Cmd.exe <project>.uproject -run=GatherText -config="Plugins/SoftbodySystem/Config/Localization/SoftbodySystem.ini" -unattended -nosplash -NullRHI
; It gathers the English tooltips (UPROPERTY/UFUNCTION/UCLASS doc comments), imports the translations from
; Content/Localization/SoftbodySystem/ko/SoftbodySystem.po and writes the .locres the editor loads.
; A translation only shows while its English source is unchanged: after editing a tooltip, fill its new msgstr and run this again.

[CommonSettings]
SourcePath=%LOCPROJECTROOT%Plugins/SoftbodySystem/Content/Localization/SoftbodySystem
DestinationPath=%LOCPROJECTROOT%Plugins/SoftbodySystem/Content/Localization/SoftbodySystem
ManifestName=SoftbodySystem.manifest
ArchiveName=SoftbodySystem.archive
PortableObjectName=SoftbodySystem.po
ResourceName=SoftbodySystem.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ko

; Gather the tooltips from metadata
[GatherTextStep0]
CommandletClass=GatherTextFromMetaData
ModulesToPreload=Softbody
ModulesToPreload=SoftbodyEditor
IncludePathFilters=%LOCPROJECTROOT%Plugins/SoftbodySystem/Source/*
InputKeys=ToolTip
OutputNamespaces=UObjectToolTips
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

; Write the manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

; Write the archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; Import the translated PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

; Write the .locres files
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

; Export the PO files (new tooltips appear with an empty msgstr)
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
